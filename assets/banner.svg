<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 180" width="854" height="180" role="img" aria-label="rimulab Backend &amp; Cloud Engineer">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b3ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #0d1117; }
      .t { font-size: 56px; font-weight: 800; }
      .d { font-size: 20px; font-weight: 600; letter-spacing: 1px; }
      .w1 { animation: drift 7s ease-in-out infinite; }
      .w2 { animation: drift 9s ease-in-out infinite reverse; }
      @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-40px); } }
    </style>
  </defs>
  <rect width="854" height="180" fill="url(#g)"/>
  <path class="w1" opacity=".18" fill="#fff" d="M-40 130 C 100 90, 220 170, 360 130 S 620 90, 760 130 S 900 160, 940 130 V180 H-40 Z"/>
  <path class="w2" opacity=".25" fill="#0d1117" d="M-40 150 C 120 120, 240 180, 380 150 S 640 120, 780 150 S 900 170, 940 150 V180 H-40 Z"/>
  <text class="t" x="427" y="82" text-anchor="middle">rimulab</text>
  <text class="d" x="427" y="116" text-anchor="middle">Backend &amp; Cloud Engineer</text>
</svg>
